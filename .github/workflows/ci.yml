name: CI

on:
  push:
  pull_request:
    branches: [main, New-Features]
  workflow_dispatch:

jobs:
  extension-tests:
    name: Extension checks & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GJS and GLib tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs gir1.2-glib-2.0 gir1.2-soup-3.0 libglib2.0-bin

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install npm dev tooling
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Compile GSettings schema
        run: make compile-schemas

      - name: ES module syntax checks
        run: make check

      - name: Unit tests
        run: make test

      - name: Package smoke test
        run: make package

  rag-server-tests:
    name: RAG service unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rag-service/requirements.txt

      - name: Install RAG service dependencies
        run: pip install -r rag-service/requirements.txt

      - name: Run RAG service tests
        run: python -m unittest discover -s rag-service/tests -p 'test_*.py'
